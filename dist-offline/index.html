<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <title>NVU-BUS - Bus subscription organizer</title>
    <script>
      // Applied before React mounts so the first paint already uses the chosen
      // theme. Kept inline and defensive: a blocked or throwing localStorage
      // falls through to removing the attribute, letting prefers-color-scheme
      // decide rather than leaving the page unstyled.
      // The key is the pre-rename 'projectbus.theme' on purpose: it has to match
      // src/lib/theme.ts, and renaming it would reset every device's choice.
      ;(function () {
        try {
          var stored = localStorage.getItem('projectbus.theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
            return
          }
        } catch (e) {
          /* storage unavailable */
        }
        document.documentElement.removeAttribute('data-theme')
      })()
    </script>
    <script type="module" crossorigin src="./app.js"></script>
    <link rel="stylesheet" crossorigin href="./app.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
