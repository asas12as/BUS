<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- Relative, to match `base: './'` in vite.config.ts. An absolute path
         here would resolve to the domain root and 404 when the app is served
         from a subdirectory such as a GitHub Pages project URL. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <title>NVU-BUS - Bus subscription organizer</title>
    <script>
      // Applied before React mounts so the first paint already uses the chosen
      // theme. Kept inline and defensive: a blocked or throwing localStorage
      // falls through to removing the attribute, letting prefers-color-scheme
      // decide rather than leaving the page unstyled.
      // The key is the pre-rename 'projectbus.theme' on purpose: it has to match
      // src/lib/theme.ts, and renaming it would reset every device's choice.
      ;(function () {
        try {
          var stored = localStorage.getItem('projectbus.theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored)
            return
          }
        } catch (e) {
          /* storage unavailable */
        }
        document.documentElement.removeAttribute('data-theme')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
